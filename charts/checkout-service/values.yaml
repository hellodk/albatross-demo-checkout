appid: APP-CHECKOUT-004
environment: staging
replicaCount: 1
image:
  repository: ghcr.io/hellodk/checkout-service
  tag: v2.0.9
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
healthPath: /healthz
networkPolicy:
  enabled: true
  ingressCIDR: 10.0.0.0/8
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
